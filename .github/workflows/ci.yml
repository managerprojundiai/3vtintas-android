name: Android public CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-public-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Disconnected build and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate public repository boundary
        run: bash scripts/ci/verify-public-boundary.sh

      - name: Validate Gradle wrapper files
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Eclipse Temurin 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle/libs.versions.toml
            gradle/verification-metadata.xml
            gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        run: |
          test -x ./gradlew || chmod +x ./gradlew
          ./gradlew --version

      - name: Run tests, static analysis, and disconnected assemblies
        run: >-
          ./gradlew clean quality
          :app:assembleStaging
          :app:assembleWorkforceStaging
          --no-daemon --stacktrace

      - name: Verify disconnected artifacts
        run: bash scripts/ci/verify-disconnected-build.sh
